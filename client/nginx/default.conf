# Serves the built UI and forwards API calls to the service container,
# so the browser only ever talks to one origin (same as the Vite dev proxy).
server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://service:3001;
    # An assessment waits for the LLM (retries and fallback included).
    proxy_read_timeout 180s;
  }

  location / {
    try_files $uri /index.html;
  }
}
