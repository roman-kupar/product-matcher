# Models exposed by the gateway. The service only knows the alias it is configured with
# (LLM_MODEL), so switching the underlying model is a change here or in litellm/.env, not in code.
litellm_settings:
  # Silently drop request parameters a model does not support (some models reject `temperature`),
  # so the service can send the same request to every model.
  drop_params: true
  # Provider hiccups (e.g. 503 "high demand") are retried before failing.
  num_retries: 2

router_settings:
  # If the hosted model stays unavailable, answer with the local model instead of failing the request.
  fallbacks: [{ "assessment-model": ["assessment-model-local"] }]

model_list:
  # Hosted model, chosen in litellm/.env (LiteLLM's "<provider>/<model>" format).
  # Without it, docker-compose defaults this to the local model as well.
  - model_name: assessment-model
    litellm_params:
      model: os.environ/LLM_PROVIDER_MODEL
      api_key: os.environ/LLM_PROVIDER_API_KEY

  # Local model served by Ollama on the host (`ollama pull qwen2.5:1.5b`), reached via OLLAMA_API_BASE.
  - model_name: assessment-model-local
    litellm_params:
      model: ollama_chat/qwen2.5:1.5b
